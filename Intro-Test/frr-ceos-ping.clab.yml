name: frr-ceos-ping-name
prefix: ""

topology:
  kinds:
    arista_ceos:
      env:
        CLAB_MGMT_VRF: MGMT
  nodes:
    arista-sw01:
      kind: arista_ceos
      image: ceos:4.36.2F
    arista-sw02:
      kind: arista_ceos
      image: ceos:4.36.2F
    frr-sw01:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1

  links:
    - endpoints: ["arista-sw01:eth1", "frr-sw01:eth1"]
    - endpoints: ["arista-sw01:eth2", "arista-sw02:eth1"]